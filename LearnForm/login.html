<html>
    <head>
        <title>
            Login System 
        </title>
    </head>
    <body>
        <form action="https://tranduythanh.com/process.html"
        method="get">
            <h1> Login System </h1>
            <table border="1" cellpadding="0" cellspacing="0">
                <tr>
                    <td> Username: </td>
                    <td> <input type="text" name="username" id="username"> </td>
                </tr>
                <tr>
                    <td> Password: </td>
                    <td> <input type="password" name="password" id="password"> </td>
                </tr>
                <tr>
                    <td> &nbsp;</td>
                    <td> <input type="checkbox" id="saveInfo"/>
                        <label for="saveInfo">Save Login Information</label> 
                    </td>
                </tr>
                <tr>
                    <td colspan="2"> <input type="submit" value="Login" /> 
                    <input type="reset" value="Reset" /> 
                    <button type="button" value="Reset_2">Reset_2</button>
                    <button type="button" onclick="this.style.color='red'">Click Me</button>
                </td>
                </tr>
            </table>
        </form>
    </body>
</html>
