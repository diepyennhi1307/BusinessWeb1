<html>
    <head>
        <title> Registration Form </title>
    </head>
    <style>
        form {
            width: 550px;
            max-width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        form table {
            width: 100%;
            table-layout: auto;
        }
    </style>
    <body style="background-color: #bccaff;">
        <div align="center"> <img src="images/Jackson.gif" alt="Logo"> </div>
        <form>
            <h1 style="text-align: center;"> Registration Form </h1>
            <p style="text-align: center;"> Register your Jackson Electronics product here </p>
            <table border="0" cellpadding="0" cellspacing="0" style="width: auto;">
                <tr>
                    <td>First Name:</td>
                    <td>
                        <input type="text" name="firstname" id="firstname">
                    </td>
                    <td colspan="2" style="white-space: nowrap;">
                        Last Name:
                        <input type="text" name="lastname" id="lastname" size="15">
                    </td>
                </tr>
                <tr>
                    <td>Address #1:</td>
                    <td colspan="3">
                        <input type="text" name="address1" id="address1" size="35">
                    </td>
                </tr>
                <tr>
                    <td>Address #2:</td>
                    <td colspan="3">
                        <input type="text" name="address2" id="address2" size="35">
                    </td>
                </tr>
                <tr>
                    <td> City: </td>
                    <td colspan="5">
                        <input type="text" name="city" id="city" 
                        style="width: 150px; box-sizing: border-box;">State:
                        <input type="text" name="state" id="state" 
                        style="width: 42px; box-sizing: border-box;">Zip:
                        <input type="text" name="zip" id="zip" style="width: 74px; box-sizing: border-box;">
                    </td>
                </tr>
                <tr>
                    <td> Country: </td>
                    <td> <input type="text" name="country" value="United States" id="country"> </td>
                </tr>
                <tr>
                    <td colspan="6">
                        <hr>
                    </td>
                </tr>
                <tr>
                    <td> Product: </td>
                    <td> 
                        <select name="product" id="product">
                                <option value="scanmaster">ScanMaster</option>
                                <option value="printer">Printer</option>
                                <option value="camera">Digital Camera</option>
                            </select>
                    </td>
                </tr>
                <tr>
                    <td>Date Purchased:</td>
                    <td>
                        <input type="text" name="purchasedate" id="purchasedate">
                    </td>
                </tr>
                <tr>
                    <td>Serial #:</td>
                    <td>
                        <input type="text" name="serial" id ="serial">
                    </td>
                </tr>
                <tr>
                    <td valign="top">Used for:</td>
                    <td>
                        <input type="radio" name="usedfor" value="home" id="home">
                        <label for="home">Home</label><br>
                        <input type="radio" name="usedfor" value="business" id="business">
                        <label for="business">Business</label><br>
                        <input type="radio" name="usedfor" value="government" id="government">
                        <label for="government">Government</label>
                    </td>
                    <td nowrap="nowrap">
                        <input type="radio" name="usedfor" value="education" id="education">
                        <label for="education">Educational Institution</label><br>
                        <input type="radio" name="usedfor" value="other" id="other">
                        <label for="other">Other</label>
                    </td>
                </tr>
                <tr>
                    <td valign="top" nowrap="nowrap">
                        System (check all that apply):
                    </td>
                    <td>
                        <input type="checkbox" name="system" value="windows" id="windows">
                        <label for="windows">Windows</label><br>
                        <input type="checkbox" name="system" value="macintosh" id="macintosh">
                        <label for="macintosh">Macintosh</label>
                    </td>
                    <td>
                        <input type="checkbox" name="system" value="unix" id="unix">
                        <label for="unix">UNIX</label><br>
                        <input type="checkbox" name="system" value="other" id="other1">
                        <label for="other1">Other</label>
                    </td>
                </tr>
                <tr>
                    <td colspan="6">
                        <hr>
                    </td>
                </tr>
                <tr>
                    <td valign="top">Comments?:</td>
                    <td colspan="5">
                        <textarea name="comments" rows="6" cols="35"></textarea>
                    </td>
                </tr>
            </table>
            <p style="text-align: center;">
                <input type="button"
                    value="Click to register"
                    onclick="alert('Đăng ký thành công!')">
                <input type="reset" value="Click to cancel">
            </p>
        </form>
    </body>
</html>
